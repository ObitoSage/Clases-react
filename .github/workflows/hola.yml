name: Hola Mundo

on:
  push:
  workflow_dispatch:
jobs:
  hola:
    runs-on: ubuntu-latest
    steps:
      - name: Saludar
        run: echo "Hola mundo"
      - name: descargar codigo
        uses: actions/checkout@v4
      - name: en que carpeta estas
        run: pwd
      - name: Listado de archivos
        run: ls -la
      - name: Instalar Node
        uses: actions/setup-node@v4
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar version de Node
        run: node --version
      - name: Verificar version de npm
        run: npm --version
      - name: check JS
        run: npm run check:js